name: Windows build and tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check public source boundary
        shell: pwsh
        run: ./scripts/Check-PublicSource.ps1
      - name: Test and package
        shell: pwsh
        run: ./scripts/Publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FocusTone-win-x64
          path: |
            artifacts/FocusTone-win-x64.zip
            artifacts/FocusTone-win-x64.zip.sha256
